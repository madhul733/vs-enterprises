<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta charset="utf-8" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme -->
    <meta name="theme-color" content="#061426" />

    <!-- Google Search Console Verification -->
    <meta
      name="google-site-verification"
      content="5K5BpoHMJPOFA0fVur0-OkyjBbyQQTIQO_nzYQQvxjs"
    />

    <!-- SEO Description -->
    <meta
      name="description"
      content="VS Enterprises is an authorized dealer of Siemens and Delta, providing industrial automation solutions, PLCs, HMI panels, AC drives, servo drives and automation products in Ludhiana, Punjab."
    />

    <!-- Search Engine Crawling -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.vsenterprisesco.in/"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="VS Enterprises | Industrial Automation Solutions"
    />

    <meta
      property="og:description"
      content="Authorized Siemens & Delta dealer providing PLC, HMI, AC drives, servo drives and industrial automation solutions in Ludhiana, Punjab."
    />

    <meta
      property="og:url"
      content="https://www.vsenterprisesco.in/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="VS Enterprises"
    />

    <!-- Twitter / X Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="VS Enterprises | Industrial Automation Solutions"
    />

    <meta
      name="twitter:description"
      content="Siemens & Delta industrial automation products and solutions from VS Enterprises, Ludhiana."
    />

    <!-- Page Title -->
    <title>
      VS Enterprises | Siemens & Delta Industrial Automation Solutions
    </title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>

</html>
